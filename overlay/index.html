<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Höhlenspiel</title>
  <link rel="stylesheet" href="static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
</head>
<body>
  <div id="stage">
    <div id="game"></div>

    <div id="hud">
      <div id="depth">Ebene 1</div>
      <div id="hero-name"></div>
      <div id="hero-persona"></div>
      <div id="hero-bars"></div>
      <div id="hero-inv"></div>
      <div id="status"></div>
    </div>

    <div id="char">
      <div id="char-grid">
        <span class="q q-held">Held</span>
        <span class="q q-ent">Entertainer</span>
        <span class="q q-feig">Feigling</span>
        <span class="q q-schm">Schmeichler</span>
        <span class="axis axis-x"></span>
        <span class="axis axis-y"></span>
        <span class="ax-label ax-top">mutig</span>
        <span class="ax-label ax-bottom">feige</span>
        <span class="ax-label ax-left">eigensinnig</span>
        <span class="ax-label ax-right">publikumsnah</span>
        <span id="char-dot"></span>
      </div>
      <div id="char-label">Abenteurer</div>
      <div id="char-trust"></div>
    </div>

    <div id="dice" class="hidden"></div>

    <div id="death" class="hidden">
      <div id="death-title"></div>
      <div id="death-cause"></div>
      <div id="hall-head">Ehrenhalle</div>
      <ol id="hall-list"></ol>
      <div id="death-next">Ein neuer Abenteurer macht sich bereit ...</div>
    </div>

    <div id="vote" class="hidden">
      <div id="vote-title">Wohin soll ich gehen?</div>
      <div id="vote-bars"></div>
      <div id="vote-timer"></div>
    </div>

    <div id="log"></div>

    <div id="narrator"><span id="narrator-for"></span><span id="narrator-text"></span></div>

    <div id="sound-hint" class="hidden">Für Ton einmal ins Bild klicken (in OBS nicht nötig)</div>

    <div id="chat">
      <div id="chat-lines"></div>
      <form id="testchat" class="hidden" autocomplete="off">
        <input id="tc-user" value="Tester" size="9">
        <input id="tc-text" placeholder="!links  !rechts  !geradeaus  !zurueck">
        <button type="submit">Senden</button>
      </form>
    </div>
  </div>
  <script src="static/game.js"></script>
</body>
</html>
